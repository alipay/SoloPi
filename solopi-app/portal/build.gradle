apply plugin: 'com.android.application'

android {
    if (project.hasProperty('virtualScreenExperimental')) {
        sourceSets.main.res.srcDir 'src/virtualScreenExperimental/res'
    }
    if (project.hasProperty('trustedDisplayProbe')) {
        if (!project.hasProperty('virtualScreenExperimental')) {
            throw new GradleException('trustedDisplayProbe requires virtualScreenExperimental')
        }
        sourceSets.androidTest.manifest.srcFile 'src/trustedDisplayProbe/AndroidManifest.xml'
        sourceSets.androidTest.java.srcDir 'src/trustedDisplayProbe/java'
    }
    if (project.hasProperty('fixturePipeProbe')) {
        if (!project.hasProperty('virtualScreenExperimental') || project.hasProperty('trustedDisplayProbe') || project.hasProperty('virtualScreenProbe')) {
            throw new GradleException('fixturePipeProbe requires virtualScreenExperimental and a dedicated test runner')
        }
        sourceSets.androidTest.manifest.srcFile 'src/trustedDisplayProbe/AndroidManifest.xml'
        sourceSets.androidTest.java.srcDir 'src/trustedDisplayProbe/java'
    }
    if (project.hasProperty('virtualScreenProbe')) {
        if (!project.hasProperty('virtualScreenOcr')) {
            throw new GradleException('virtualScreenProbe requires virtualScreenOcr')
        }
        sourceSets.androidTest.java.srcDir 'src/virtualScreenProbe/java'
    }
    ndkVersion rootProject.ext.ndkVersion
    signingConfigs {
        release {
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }
    compileSdkVersion rootProject.ext.compileSdkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion

    defaultConfig {
        applicationId "com.alipay.hulu"
        manifestPlaceholders = [portalAppLabel: '@string/app_name']
        minSdkVersion 18
        if (project.hasProperty('virtualScreenOcr')) {
            minSdkVersion 21
        }
        targetSdkVersion rootProject.ext.targetSdkVersion
        multiDexEnabled true
        testInstrumentationRunner 'com.alipay.hulu.security.PatchSecurityInstrumentation'
        if (project.hasProperty('virtualScreenProbe')) {
            testInstrumentationRunner 'com.alipay.hulu.virtualscreen.VirtualScreenInstrumentation'
        }
        if (project.hasProperty('trustedDisplayProbe')) {
            testInstrumentationRunner 'com.alipay.hulu.virtualscreen.TrustedDisplayHandshakeInstrumentation'
        }
        if (project.hasProperty('fixturePipeProbe')) {
            testInstrumentationRunner 'com.alipay.hulu.virtualscreen.FixturePipePermissionInstrumentation'
        }
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            if (project.hasProperty('fastpathDebug')) {
                applicationIdSuffix '.fastpath'
                manifestPlaceholders = [portalAppLabel: 'SoloPi FastPath']
            }
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            versionNameSuffix "-" + new Date().format("yyMMddHHmm")
        }
    }


    lintOptions {
        checkReleaseBuilds false
        // Or, if you prefer, you can continue to check for errors in release builds,
        // but continue the build even when errors are found:
        abortOnError false
    }

    packagingOptions {
        exclude 'META-INF/**'
        exclude 'lib/x86/**'
        exclude 'lib/armeabi/**'
        /*exclude 'assets/lineDashTexture.png'*/
    }

    dexOptions {
        javaMaxHeapSize "4g"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation "androidx.multidex:multidex:${ANDROIDX_MULTIDEX_VERSION}"
    implementation project(':app')
    androidTestCompileOnly project(':common')
    androidTestCompileOnly "commons-io:commons-io:${COMMON_IO_VERSION}"
}

android.defaultConfig.versionCode = rootProject.ext.appVersionCode
android.defaultConfig.versionName = rootProject.ext.appVersionName
