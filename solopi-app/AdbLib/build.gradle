apply plugin: 'java'

sourceSets {

    main {
        java {
            srcDirs = ['src']
            targetCompatibility = '1.7'
            sourceCompatibility = '1.7'
        }
    }

    test {
        java {
            srcDirs = ['test']
        }
    }

}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
