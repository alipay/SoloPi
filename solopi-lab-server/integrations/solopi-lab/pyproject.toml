[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "solopi-lab"
version = "0.1.0"
description = "Platform-independent laboratory scheduling companion for solopi-desktop"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
solopi-lab = "solopi_lab.__main__:main"

[tool.setuptools.packages.find]
include = ["solopi_lab*"]
